services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  producer:
    build: ./apps/producer
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
    env_file:
      - .env
  consumer:
    build: ./apps/consumer
    depends_on:
      - rabbitmq
  notifier:
    build: ./apps/notifier
    ports:
      - "3001:3001"
    env_file:
      - .env