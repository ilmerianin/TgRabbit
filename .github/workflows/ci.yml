name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nest-microservices/package-lock.json

      - name: Install dependencies
        working-directory: nest-microservices
        run: npm ci

      - name: Unit tests
        working-directory: nest-microservices
        run: npm test

      - name: E2E tests
        working-directory: nest-microservices
        run: npm run test:e2e
